name: CI

on:
  pull_request:
  push:
    branches:
      - eagle

permissions:
  contents: read

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: |
          unset SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD
          ./mvnw --batch-mode clean test

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell scripts and Compose configuration
        run: |
          set -euo pipefail
          bash -n deploy/gcp/render-runtime-secrets.sh
          bash -n deploy/gcp/provision-n8n-credentials.sh
          bash -n deploy/gcp/smoke-core.sh
          bash -n deploy/gcp/smoke-07.sh

          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "${runtime_dir}"' EXIT
          install -m 0600 /dev/null "${runtime_dir}/backend.env"
          install -m 0600 /dev/null "${runtime_dir}/n8n.env"
          install -m 0600 /dev/null "${runtime_dir}/web.env"
          install -m 0600 /dev/null "${runtime_dir}/firebase-service-account.json"
          RUNTIME_DIR="${runtime_dir}" docker compose \
            --env-file deploy/gcp/deploy.env.example \
            -f deploy/gcp/docker-compose.yml config >/dev/null
      - name: Validate Caddy configurations
        run: |
          docker run --rm \
            -e ACME_EMAIL=ops@example.com \
            -v "${PWD}/deploy/gcp/Caddyfile.staging:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e ACME_EMAIL=ops@example.com \
            -v "${PWD}/deploy/gcp/Caddyfile.production:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
